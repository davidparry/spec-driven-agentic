# Release pipeline configuration for dist (cargo-dist).
# The Cargo workspace lives in harness/, not at the repo root, so the member
# uses the `cargo:` form to point at it. dist generates
# .github/workflows/release.yml while reading crate metadata from
# harness/Cargo.toml.
[workspace]
members = ["cargo:harness/"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Update the stable channel before building: harness/rust-toolchain.toml pins
# channel = "stable", and the runners' preinstalled stable can lag behind
# the rust-version the crate requires
rust-toolchain-version = "stable"

# Publish the uninstaller next to the installer; it reads the install
# receipt and removes exactly what the installer put down
[[dist.extra-artifacts]]
artifacts = ["bdd-harness-uninstaller.sh"]
build = ["cp", "scripts/bdd-harness-uninstaller.sh", "bdd-harness-uninstaller.sh"]
