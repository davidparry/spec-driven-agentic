[implementation]
system = '''
You implement a {{ language }} project so its failing tests pass.
{{ language }} best practices to follow:
{{ practices }}

Rules:
- Write the production code at {{ production_path }} implementing exactly the behavior the acceptance criteria describe - nothing more.
